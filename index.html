<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <body>
   <body>
<div class="login-box">

    <!-- LOGIN -->
    <div id="loginForm">

        <h1 class="login-title">LOGIN</h1>

        <input type="email" class="input-box" placeholder="Email Address">

        <input type="password" class="input-box" placeholder="Password">

        <button class="login-btn">Login</button>

        <p class="register-text">
            Belum punya akun?
            <a href="#" id="showRegister">Daftar</a>
        </p>

    </div>

    <!-- REGISTER -->
    <div id="registerForm" style="display:none;">

        <h1 class="login-title">DAFTAR</h1>

        <input type="text" class="input-box" placeholder="Nama Lengkap">

        <input type="email" class="input-box" placeholder="Email Address">

        <input type="password" class="input-box" placeholder="Password">

        <input type="password" class="input-box" placeholder="Konfirmasi Password">

        <button class="login-btn">Daftar</button>

        <p class="register-text">
            Sudah punya akun?
            <a href="#" id="showLogin">Login</a>
        </p>

    </div>

</div>
<script src="script.js"></script>
<body><!-- Logo Gambar di Pojok Kiri Atas -->
<div class="logo-container">
    <img src="exnime.png" alt="EXNime Logo" class="logo-img">
</div>
</body>

</body>
</html>
