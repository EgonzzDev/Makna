<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <body>

<div class="login-box">

    <h1 class="login-title">LOGIN</h1>

    <input
        type="email"
        class="input-box"
        placeholder="Email Address"
    >

    <input
        type="password"
        class="input-box"
        placeholder="Password"
    >

    <div class="login-option">
        <label>
            <input type="checkbox">
            ingat saya
        </label>

        <a href="#">Forgot Password?</a>
    </div>

    <button class="login-btn">
        Login
    </button>

    <button class="google-btn">
        Login with Google
    </button>

    <p class="register-text">
        Belum punya akun?
        <a href="#">Daftar</a>
    </p>

</div>

</body>
  
</div>

</body>
</html>
