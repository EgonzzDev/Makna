<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <body>
   <body>
<div class="login-box">
    <!-- Tambahan Logo Elaina & Teks Sayang di dalam kotak login -->
    <div class="login-header-profile">
        <img src="elaina.png" alt="Elaina Profile" class="elaina-avatar">
        <p class="login-sweet-text">login dulu ya sayang 😘</p>
    <div>
    <!-- LOGIN -->
    <div id="loginForm">

        <h1 class="login-title">LOGIN</h1>

        <input type="email" class="input-box" placeholder="Email Address">

        <input type="password" class="input-box" placeholder="Password">

        <button class="login-btn">Login</button>

      <p class="register-text">
    Belum punya akun? <span id="showRegister" style="cursor: pointer; color: #3b82f6; position: relative; z-index: 99;">Daftar</span>
</p>

<!-- FORM REGISTER / DAFTAR -->
<form id="register-form" class="auth-form hidden">
    <h2 class="login-title">DAFTAR</h2>
    <div class="input-group">
        <input type="text" id="reg-name" placeholder="Nama Lengkap" required>
    </div>
    <div class="input-group">
        <input type="email" id="reg-email" placeholder="Email Address" required>
    </div>
    <div class="input-group">
        <input type="password" id="reg-password" placeholder="Password Baru" required>
    </div>
    <button type="submit" class="btn-login">Daftar Sekarang</button>
    <p class="signup-link">Sudah punya akun? <a href="#" id="to-login">Login</a></p>
</form>
    </div>
</div>
<script src="script.js"></script>
<body><!-- Logo Gambar di Pojok Kiri Atas -->
<div class="logo-container">
    <img src="exnime.png" alt="EXNime Logo" class="logo-img">

  
</body>
</html>
