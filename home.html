<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - EXNime</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .home-container {
            text-align: center;
            color: #fff;
            padding: 20px;
        }
        .home-container h1 {
            font-size: 32px;
            color: #ff9ff3;
            margin-bottom: 10px;
        }
        .logout-btn {
            background: #ff4757;
            margin-top: 20px;
            border: none;
            padding: 10px 20px;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="logo-container">
    <img src="exnime.png" alt="EXNime Logo" class="logo-img">
</div>

<div class="container">
  <div class="login-box home-container">
    <div class="login-header-profile">
        <img src="elaina.png" alt="Elaina Profile" class="elaina-avatar">
    </div>
    <h1>Selamat Datang! ❤️</h1>
    <p id="welcome-text" style="color: #ccc; font-size: 14px;"></p>
    
    <button class="logout-btn" id="logout-btn">Logout</button>
  </div>
</div>

<script>
    // Ambil nama user dari localStorage
    const userName = localStorage.getItem('savedName') || "Sayang";
    document.getElementById('welcome-text').innerText = "Halo, " + userName + "! Kamu berhasil masuk ke EXNime.";

    // Tombol Logout
    document.getElementById('logout-btn').addEventListener('click', function() {
        window.location.href = "index.html";
    });
</script>
</body>
</html>
